name: Test

# Needs a published servo apk to install, so it runs on the same tags as
# release.yml plus on demand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-bash-unit:
    uses: bbusse/github-workflows/.github/workflows/run-tests-bash-unit.yml@dev
    with:
      test_files: tests/tests.sh
      install_klue_test_deps: false
